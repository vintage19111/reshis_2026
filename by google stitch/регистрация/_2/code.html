<!DOCTYPE html>

<html class="dark" lang="ru"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"primary-fixed":"#b2ebff","error-container":"#93000a","on-tertiary-fixed-variant":"#004e60","surface-container-low":"#1a1c1f","on-error-container":"#ffdad6","surface-container-lowest":"#0c0e11","tertiary-fixed-dim":"#6fd3f5","surface-tint":"#5dd5f7","error":"#ffb4ab","secondary":"#ffb957","on-primary-fixed-variant":"#004e5e","inverse-surface":"#e2e2e6","on-tertiary":"#003543","inverse-on-surface":"#2f3034","on-primary":"#003642","on-surface":"#e2e2e6","surface-variant":"#333538","on-primary-fixed":"#001f27","on-tertiary-container":"#003846","on-secondary":"#462b00","surface-container-highest":"#333538","inverse-primary":"#00677d","primary":"#5dd5f7","secondary-fixed":"#ffddb5","outline-variant":"#3d494d","tertiary":"#6fd3f5","primary-container":"#1aa9c9","secondary-container":"#d98e00","on-primary-container":"#003845","on-secondary-fixed":"#2a1800","tertiary-container":"#3ba7c7","on-secondary-container":"#4c2f00","surface":"#111316","on-error":"#690005","surface-dim":"#111316","outline":"#879397","on-secondary-fixed-variant":"#643f00","surface-container":"#1e2023","primary-fixed-dim":"#5dd5f7","tertiary-fixed":"#b6ebff","surface-container-high":"#282a2d","surface-bright":"#37393d","on-surface-variant":"#bcc8cd","on-background":"#e2e2e6","on-tertiary-fixed":"#001f28","secondary-fixed-dim":"#ffb957","background":"#111316"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"space-xl":"2.5rem","space-md":"1rem",gutter:"1.5rem","space-sm":"0.5rem","space-xs":"0.25rem","space-lg":"1.5rem",margin:"2.5rem"},fontFamily:{"title-sm":["Manrope"],"mono-metric":["Manrope"],"display-hero":["Manrope"],"display-hero-mobile":["Manrope"],"body-lg":["Manrope"],"label-sm":["Manrope"],"headline-xl-mobile":["Manrope"],"headline-md":["Manrope"],"body-md":["Manrope"],"label-md":["Manrope"],"headline-xl":["Manrope"],"headline-lg":["Manrope"]},fontSize:{"title-sm":["16px",{lineHeight:"22px",letterSpacing:"0em",fontWeight:"600"}],"mono-metric":["24px",{lineHeight:"28px",letterSpacing:"-0.02em",fontWeight:"800"}],"display-hero":["52px",{lineHeight:"58px",letterSpacing:"-0.03em",fontWeight:"800"}],"display-hero-mobile":["34px",{lineHeight:"40px",letterSpacing:"-0.02em",fontWeight:"800"}],"body-lg":["16px",{lineHeight:"24px",letterSpacing:"0em",fontWeight:"400"}],"label-sm":["11px",{lineHeight:"14px",letterSpacing:"0.06em",fontWeight:"700"}],"headline-xl-mobile":["26px",{lineHeight:"32px",letterSpacing:"-0.01em",fontWeight:"700"}],"headline-md":["20px",{lineHeight:"28px",letterSpacing:"-0.01em",fontWeight:"700"}],"body-md":["14px",{lineHeight:"20px",letterSpacing:"0em",fontWeight:"400"}],"label-md":["13px",{lineHeight:"18px",letterSpacing:"0.02em",fontWeight:"600"}],"headline-xl":["38px",{lineHeight:"44px",letterSpacing:"-0.02em",fontWeight:"800"}],"headline-lg":["26px",{lineHeight:"34px",letterSpacing:"-0.015em",fontWeight:"700"}]}}}}</script></head><body class="bg-surface font-body-md text-on-surface min-h-screen flex items-center justify-center p-gutter"><main class="w-full max-w-md bg-surface"><div class="flex flex-col w-full relative items-center justify-center py-space-sm select-none">
<!-- Subtle Orbital Trajectory Graphics -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden">
<svg class="w-[780px] h-[780px] opacity-20 text-primary animate-pulse" fill="none" viewbox="0 0 600 600">
<circle cx="300" cy="300" opacity="0.3" r="280" stroke="currentColor" stroke-dasharray="3 6" stroke-width="1"></circle>
<circle cx="300" cy="300" opacity="0.4" r="210" stroke="currentColor" stroke-width="1"></circle>
<circle cx="300" cy="300" opacity="0.5" r="140" stroke="currentColor" stroke-dasharray="8 8" stroke-width="1"></circle>
<line opacity="0.25" stroke="currentColor" stroke-dasharray="4 4" stroke-width="0.5" x1="300" x2="300" y1="20" y2="580"></line>
<line opacity="0.25" stroke="currentColor" stroke-dasharray="4 4" stroke-width="0.5" x1="20" x2="580" y1="300" y2="300"></line>
<path d="M120,420 A240,240 0 0,1 480,180" opacity="0.6" stroke="currentColor" stroke-width="1.5"></path>
<circle cx="480" cy="180" fill="currentColor" r="3.5"></circle>
<circle cx="120" cy="420" fill="currentColor" opacity="0.7" r="2.5"></circle>
</svg>
<div class="absolute w-72 h-72 rounded-full bg-primary-container/10 blur-3xl pointer-events-none"></div>
</div>
<!-- Header Block: Visual Identity & Telemetry Title -->
<div class="relative z-10 w-full text-center mb-space-md">
<div class="inline-flex items-center gap-space-xs px-space-sm py-0.5 rounded-full bg-surface-container-high/80 text-primary font-label-sm text-label-sm uppercase tracking-wider mb-space-xs shadow-sm">
<span class="material-symbols-outlined text-[13px] animate-spin" style="animation-duration: 9s;">radar</span>
<span>СИСТЕМА ТЕЛЕМЕТРИИ СПРОСА</span>
</div>
<h1 class="text-on-surface font-headline-xl text-headline-xl tracking-tight">
      Рассчитай спрос
    </h1>
<p class="text-on-surface-variant font-body-lg text-body-lg mt-1 tracking-normal">
      Прогноз спроса на авиабилеты за пару секунд
    </p>
</div>
<!-- Central Authentication Interface Surface -->
<div class="relative z-10 w-full max-w-[440px] bg-surface-container-low rounded-xl p-space-lg shadow-xl shadow-surface-container-lowest/80">
<!-- Segmented Navigation Switcher -->
<div class="grid grid-cols-2 p-1 bg-surface-container-lowest rounded-lg mb-space-md">
<button class="py-2 text-center rounded-DEFAULT font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" type="button">
        Регистрация
      </button>
<button class="py-2 text-center rounded-DEFAULT font-label-md text-label-md bg-surface-container-high text-primary shadow-sm" type="button">
        Вход
      </button>
</div>
<!-- Telemetry Validation Alert -->
<div class="flex items-start gap-space-sm p-3 rounded-lg bg-error-container/40 text-on-error-container mb-space-md">
<span class="material-symbols-outlined text-[20px] text-error flex-shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">
        error
      </span>
<div class="font-body-md text-body-md text-error leading-snug">
        Неверный email или пароль. Проверьте правильность введённых данных.
      </div>
</div>
<!-- Login Parameter Form -->
<form class="space-y-space-md" onsubmit="event.preventDefault();">
<!-- Input: Corporate / Dispatcher Email -->
<div class="space-y-1">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="aeroflot-email">
          Email
        </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest text-on-surface font-title-sm text-title-sm px-3.5 py-3 rounded-lg outline-none focus:bg-surface-container-high text-error" id="aeroflot-email" type="email" value="alexey@airline.com"/>
<div class="absolute right-3 flex items-center pointer-events-none text-error">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</div>
</div>
</div>
<!-- Input: Access Key / Secret -->
<div class="space-y-1">
<div class="flex items-center justify-between">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="aeroflot-password">
            Пароль
          </label>
<span class="font-label-sm text-label-sm text-primary/80">ШИФРОВАНИЕ TLS 1.3</span>
</div>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest text-on-surface font-title-sm text-title-sm px-3.5 py-3 pr-10 rounded-lg outline-none focus:bg-surface-container-high" id="aeroflot-password" type="password" value="12345678"/>
<button aria-label="Показать пароль" class="absolute right-3 text-on-surface-variant hover:text-primary transition-colors flex items-center" id="toggle-pwd" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Controls Row: Session Persistence & Password Recovery -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-space-xs cursor-pointer group">
<input checked="" class="w-4 h-4 rounded-DEFAULT bg-surface-container-lowest text-primary-container focus:ring-0 focus:outline-none accent-primary cursor-pointer" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">
            Запомнить меня
          </span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors" href="#reset">
          Забыли пароль?
        </a>
</div>
<!-- Primary Execution Button -->
<button class="w-full bg-primary-container hover:bg-primary text-on-primary font-headline-md text-headline-md py-3.5 px-4 rounded-lg flex items-center justify-center gap-space-xs transition-all shadow-md active:scale-[0.99]" type="submit">
<span>Войти</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Navigation Escalation Anchor -->
<div class="text-center pt-space-lg mt-space-md border-t-0">
<span class="font-body-md text-body-md text-on-surface-variant">Нет аккаунта? </span>
<a class="font-title-sm text-title-sm text-primary hover:text-primary-fixed underline transition-colors decoration-primary/40 underline-offset-4" href="#register">
        Зарегистрироваться
      </a>
</div>
<!-- Institutional System Signature -->
<div class="flex items-center justify-center gap-space-xs mt-space-lg text-on-surface-variant/60 font-label-sm text-label-sm tracking-widest uppercase">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span>РЕШИСЬ АВИА • ПЛАТФОРМА ПРЕДИКТИВНОГО СКОРИНГА</span>
</div>
</div>
</div>
<script>
  (function() {
    const pwdInput = document.getElementById('aeroflot-password');
    const toggleBtn = document.getElementById('toggle-pwd');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
