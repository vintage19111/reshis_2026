<!DOCTYPE html><html lang="ru"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="web_blank" name="shell-type">
<title>Рассчитай спрос — Решись Авиа</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            "body-lg": ["Manrope", "sans-serif"],
            "label-md": ["Manrope", "sans-serif"],
            "mono-metric": ["Manrope", "sans-serif"],
            "body-md": ["Manrope", "sans-serif"],
            "headline-md": ["Manrope", "sans-serif"],
            "label-sm": ["Manrope", "sans-serif"],
            "headline-xl": ["Manrope", "sans-serif"],
            "headline-lg": ["Manrope", "sans-serif"],
            "title-sm": ["Manrope", "sans-serif"],
            "display-hero": ["Manrope", "sans-serif"]
          },
          fontSize: {
            "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "400" }],
            "label-md": ["13px", { lineHeight: "18px", letterSpacing: "0.02em", fontWeight: "600" }],
            "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }],
            "headline-md": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "700" }],
            "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.06em", fontWeight: "700" }],
            "headline-xl": ["38px", { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "800" }],
            "headline-lg": ["26px", { lineHeight: "34px", letterSpacing: "-0.015em", fontWeight: "700" }],
            "title-sm": ["16px", { lineHeight: "22px", letterSpacing: "0em", fontWeight: "600" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-[#F3F5F7] font-body-md text-[#0A0A0B] min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
<!-- Subtle Orbital Trajectory Graphics (Light theme adapted) -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden">
<svg class="w-[840px] h-[840px] opacity-35 text-[#1AA9C9]" fill="none" viewBox="0 0 600 600">
<circle cx="300" cy="300" opacity="0.3" r="280" stroke="currentColor" stroke-dasharray="3 6" stroke-width="1"></circle>
<circle cx="300" cy="300" opacity="0.35" r="210" stroke="currentColor" stroke-width="1"></circle>
<circle cx="300" cy="300" opacity="0.45" r="140" stroke="currentColor" stroke-dasharray="8 8" stroke-width="1"></circle>
<line opacity="0.25" stroke="currentColor" stroke-dasharray="4 4" stroke-width="0.75" x1="300" x2="300" y1="20" y2="580"></line>
<line opacity="0.25" stroke="currentColor" stroke-dasharray="4 4" stroke-width="0.75" x1="20" x2="580" y1="300" y2="300"></line>
<path d="M120,420 A240,240 0 0,1 480,180" opacity="0.5" stroke="currentColor" stroke-width="1.5"></path>
<circle cx="480" cy="180" fill="currentColor" r="3.5"></circle>
<circle cx="120" cy="420" fill="currentColor" opacity="0.7" r="2.5"></circle>
</svg>
<div class="absolute w-96 h-96 rounded-full bg-[#1AA9C9]/10 blur-3xl pointer-events-none"></div>
</div>
<main class="w-full max-w-md relative z-10">
<div class="flex flex-col w-full items-center justify-center py-2 select-none">
<!-- Header Block: Visual Identity & Telemetry Title -->
<div class="w-full text-center mb-6">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/90 border border-[#E5E7EB] text-[#0284C7] font-label-sm text-label-sm uppercase tracking-wider mb-3 shadow-xs">
<span class="material-symbols-outlined text-[14px] animate-spin" style="animation-duration: 9s;">radar</span>
<span>СИСТЕМА ТЕЛЕМЕТРИИ СПРОСА</span>
</div>
<h1 class="text-[#0A0A0B] font-headline-xl text-headline-xl tracking-tight">
          Рассчитай спрос
        </h1>
<p class="text-[#4B5563] font-body-lg text-body-lg mt-1 tracking-normal">
          Прогноз спроса на авиабилеты за пару секунд
        </p>
</div>
<!-- Central Authentication Interface Surface -->
<div class="w-full max-w-[440px] bg-white rounded-2xl p-7 border border-[#E5E7EB] shadow-xl shadow-slate-200/60">
<!-- Segmented Navigation Switcher -->
<div class="grid grid-cols-2 p-1 bg-[#F3F4F6] rounded-xl mb-5 border border-[#E5E7EB]/60">
<button class="py-2 text-center rounded-lg font-label-md text-label-md text-[#6B7280] hover:text-[#0A0A0B] transition-colors" type="button">
            Регистрация
          </button>
<button class="py-2 text-center rounded-lg font-label-md text-label-md bg-white text-[#0A0A0B] font-semibold shadow-sm border border-black/5" type="button"><span class="inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[#1AA9C9]"></span><span>Вход</span></span></button>
</div>
<!-- Telemetry Validation Alert -->
<div class="flex items-start gap-2.5 p-3 rounded-xl bg-[#FEE2E2] border border-[#FCA5A5] text-[#991B1B] mb-5">
<span class="material-symbols-outlined text-[20px] text-[#DC2626] flex-shrink-0 mt-0.5" style="font-variation-settings: 'FILL' 1;">
            error
          </span>
<div class="font-body-md text-body-md text-[#991B1B] leading-snug">
            Неверный email или пароль. Проверьте правильность введённых данных.
          </div>
</div>
<!-- Login Parameter Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Input: Corporate / Dispatcher Email -->
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-[#4B5563] uppercase tracking-wider font-semibold" for="aeroflot-email">
              Email
            </label>
<div class="relative flex items-center">
<input class="w-full bg-[#F9FAFB] border border-[#F87171] text-[#0A0A0B] font-title-sm text-title-sm px-3.5 py-3 pr-10 rounded-xl outline-none focus:bg-white focus:border-[#DC2626] focus:ring-2 focus:ring-[#FEE2E2] transition-all" id="aeroflot-email" type="email" value="alexey@airline.com">
<div class="absolute right-3.5 flex items-center pointer-events-none text-[#DC2626]">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</div>
</div>
</div>
<!-- Input: Access Key / Secret -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block font-label-sm text-label-sm text-[#4B5563] uppercase tracking-wider font-semibold" for="aeroflot-password">
                Пароль
              </label>
<span class="font-label-sm text-label-sm text-[#0284C7] font-semibold tracking-wider">ШИФРОВАНИЕ TLS 1.3</span>
</div>
<div class="relative flex items-center">
<input class="w-full bg-[#F9FAFB] border border-[#D1D5DB] text-[#0A0A0B] font-title-sm text-title-sm px-3.5 py-3 pr-10 rounded-xl outline-none focus:bg-white focus:border-[#0284C7] focus:ring-2 focus:ring-[#0284C7]/15 transition-all" id="aeroflot-password" type="password" value="12345678">
<button aria-label="Показать пароль" class="absolute right-3.5 text-[#6B7280] hover:text-[#0A0A0B] transition-colors flex items-center" id="toggle-pwd" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Controls Row: Session Persistence & Password Recovery -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input checked="" class="w-4 h-4 rounded-md border-[#D1D5DB] text-[#0A0A0B] focus:ring-[#0284C7] cursor-pointer" type="checkbox">
<span class="font-body-md text-body-md text-[#4B5563] group-hover:text-[#0A0A0B] transition-colors">
                Запомнить меня
              </span>
</label>
<a class="font-label-md text-label-md text-[#1AA9C9] hover:text-[#0284C7] transition-colors font-semibold" href="#reset">Забыли пароль?</a>
</div>
<!-- Primary CTA Button "Войти": dark #0A0A0B with white bold text -->
<button class="w-full bg-[#1AA9C9] hover:bg-[#1594B0] text-white font-headline-md text-headline-md py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md shadow-[#1AA9C9]/25 hover:shadow-lg hover:shadow-[#1AA9C9]/35 active:scale-[0.99] cursor-pointer" type="submit"><span class="font-bold tracking-wide">Войти</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button>
</form>
<!-- Navigation Escalation Anchor -->
<div class="text-center pt-5 mt-4 border-t border-[#F3F4F6]">
<span class="font-body-md text-body-md text-[#6B7280]">Нет аккаунта? </span>
<a class="font-title-sm text-title-sm text-[#1AA9C9] hover:text-[#0284C7] underline underline-offset-4 decoration-[#1AA9C9]/40 transition-colors font-semibold" href="#register">Зарегистрироваться</a>
</div>
<!-- Institutional System Signature -->
<div class="flex items-center justify-center gap-1.5 mt-5 text-[#9CA3AF] font-label-sm text-label-sm tracking-widest uppercase">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span>РЕШИСЬ АВИА • ПЛАТФОРМА ПРЕДИКТИВНОГО СКОРИНГА</span>
</div>
</div>
</div>
</main>
<script>
    (function() {
      const pwdInput = document.getElementById('aeroflot-password');
      const toggleBtn = document.getElementById('toggle-pwd');
      const eyeIcon = document.getElementById('eye-icon');

      if (toggleBtn && pwdInput && eyeIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = pwdInput.getAttribute('type') === 'password';
          pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
          eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }
    })();
  </script>


</body></html>
