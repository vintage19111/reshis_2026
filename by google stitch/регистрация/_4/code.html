<!-- Interactive & Decorative Background Elements -->
<div class="relative w-full overflow-hidden flex flex-col items-center">
<!-- Radar Telemetry & Orbital Concentric Geometries -->
<div class="pointer-events-none absolute inset-0 flex items-center justify-center opacity-60 select-none">
<svg class="w-[840px] h-[840px] -translate-y-16 animate-[spin_160s_linear_infinite]" fill="none" viewBox="0 0 840 840">
<circle class="text-cyan-500/20" cx="420" cy="420" r="140" stroke="currentColor" stroke-dasharray="3 6" stroke-width="1"></circle>
<circle class="text-cyan-500/25" cx="420" cy="420" r="240" stroke="currentColor" stroke-width="1"></circle>
<circle class="text-cyan-500/15" cx="420" cy="420" r="340" stroke="currentColor" stroke-dasharray="8 8" stroke-width="1"></circle>
<circle class="text-cyan-500/10" cx="420" cy="420" r="410" stroke="currentColor" stroke-width="1"></circle>
<line class="text-cyan-500/15" stroke="currentColor" stroke-dasharray="4 8" stroke-width="1" x1="420" x2="420" y1="10" y2="830"></line>
<line class="text-cyan-500/15" stroke="currentColor" stroke-dasharray="4 8" stroke-width="1" x1="10" x2="830" y1="420" y2="420"></line>
</svg>
<!-- Atmospheric Glow Aura -->
<div class="absolute w-96 h-96 rounded-full bg-cyan-400/10 blur-[100px] pointer-events-none -translate-y-20"></div>
</div>
<!-- Header Navigation Chrome -->
<div class="relative z-10 w-full flex items-center justify-between px-2 pt-2 pb-8">
<div class="flex items-center space-x-2.5">
<div class="w-8 h-8 rounded-lg bg-white border border-[#E5E7EB] flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[#1AA9C9] text-[20px]" style="font-variation-settings: &quot;FILL&quot; 1;">flight_takeoff</span>
</div>
<div class="flex flex-col">
<span class="font-title-sm text-title-sm text-[#0A0A0B] tracking-tight leading-none font-bold">Решись Авиа</span>
<span class="font-label-sm text-label-sm text-[#6B7280] tracking-widest uppercase mt-0.5 text-[9px] leading-tight">Intelligence</span>
</div>
</div>
<button aria-label="Сменить тему" class="w-8 h-8 rounded-lg bg-white border border-[#E5E7EB] hover:bg-gray-50 flex items-center justify-center text-[#4B5563] shadow-sm transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">dark_mode</span>
</button>
</div>
<!-- Headline Staging Area -->
<div class="relative z-10 text-center w-full px-4 mb-6">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#1AA9C9]/10 border border-[#1AA9C9]/30 shadow-sm mb-3"><span class="w-1.5 h-1.5 rounded-full bg-[#1AA9C9] animate-pulse"></span><span class="font-label-sm text-label-sm text-[#00677D] font-bold uppercase tracking-wider text-[10px]">ML Predictive Hub</span></div>
<h1 class="font-headline-xl text-headline-xl text-[#0A0A0B] tracking-tight mb-2 font-extrabold">Рассчитай спрос</h1>
<p class="font-body-md text-body-md text-[#4B5563] max-w-xs mx-auto">
        Прогноз спроса на авиабилеты за пару секунд
      </p>
</div>
<!-- Centered Aerospace Auth Card -->
<div class="relative z-10 w-full rounded-2xl bg-white border border-[#E5E7EB] shadow-xl p-6 sm:p-8 backdrop-blur-md">
<!-- Monolithic Segmented Tabs -->
<div class="grid grid-cols-2 p-1 bg-[#F3F4F6] rounded-xl mb-6 border border-[#E5E7EB]">
<button class="relative py-2.5 rounded-lg font-label-md text-label-md transition-all text-[#0A0A0B] bg-white shadow-sm flex items-center justify-center gap-1.5 font-bold" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-[#1AA9C9]"></span>
<span>Регистрация</span>
</button>
<button class="py-2.5 rounded-lg font-label-md text-label-md text-[#6B7280] hover:text-[#0A0A0B] transition-colors flex items-center justify-center font-medium" type="button">
<span>Вход</span>
</button>
</div>
<!-- Authentication Form -->
<form class="space-y-4" onsubmit="event.preventDefault()">
<!-- Field 1: Name (Valid) -->
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-[#374151] tracking-wider uppercase font-semibold" for="user-name">
            Имя
          </label>
<div class="relative flex items-center">
<input class="w-full bg-[#F9FAFB] border border-[#10B981] text-[#0A0A0B] font-title-sm text-title-sm px-4 py-3 rounded-xl pr-11 focus:outline-none focus:ring-2 focus:ring-[#10B981]/20 transition-all" id="user-name" placeholder="Иван Иванов" type="text" value="Алексей Смирнов">
<div class="absolute right-3.5 flex items-center justify-center text-[#10B981] pointer-events-none">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
<!-- Field 2: Email (With inline validation error) -->
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-[#374151] tracking-wider uppercase font-semibold" for="user-email">
            Email
          </label>
<div class="relative flex items-center">
<input class="w-full bg-[#F9FAFB] border border-[#EF4444] text-[#DC2626] font-title-sm text-title-sm px-4 py-3 rounded-xl pr-11 focus:outline-none focus:ring-2 focus:ring-[#EF4444]/20 transition-all" id="user-email" placeholder="name@aero-corp.ru" type="email" value="alexey.smirnov@">
<div class="absolute right-3.5 flex items-center justify-center text-[#EF4444] pointer-events-none">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
</div>
<div class="flex items-center gap-1.5 pt-0.5 text-[#DC2626] px-1">
<span class="material-symbols-outlined text-[14px]">info</span>
<span class="font-label-sm text-label-sm text-[12px] leading-tight font-medium">Введите корректный email адрес</span>
</div>
</div>
<!-- Field 3: Password + Strength Indicator -->
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-[#374151] tracking-wider uppercase font-semibold" for="user-password">
            Пароль
          </label>
<div class="relative flex items-center">
<input class="w-full bg-[#F9FAFB] border border-[#D1D5DB] text-[#0A0A0B] font-title-sm text-title-sm px-4 py-3 rounded-xl pr-11 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all tracking-wide" id="user-password" type="text" value="Aer0_Demand2025#">
<button aria-label="Скрыть пароль" class="absolute right-3.5 flex items-center justify-center text-[#6B7280] hover:text-[#0A0A0B] transition-colors" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Password Metric Bar -->
<div class="pt-1.5 space-y-1.5 px-0.5">
<div class="grid grid-cols-3 gap-1.5 h-1 w-full">
<div class="bg-[#10B981] rounded-full"></div>
<div class="bg-[#10B981] rounded-full"></div>
<div class="bg-[#E5E7EB] rounded-full"></div>
</div>
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm text-[#10B981] text-[11px] tracking-wide font-bold">Надёжный пароль</span>
<span class="font-label-sm text-label-sm text-[#6B7280] text-[11px] font-medium">2 / 3 сегментов</span>
</div>
</div>
</div>
<!-- Field 4: Confirm Password -->
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-[#374151] tracking-wider uppercase font-semibold" for="user-confirm-password">
            Повторите пароль
          </label>
<div class="relative flex items-center">
<input class="w-full bg-[#F9FAFB] border border-[#D1D5DB] text-[#0A0A0B] font-title-sm text-title-sm px-4 py-3 rounded-xl focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition-all placeholder:text-[#9CA3AF] placeholder:font-normal" id="user-confirm-password" placeholder="Повторите пароль" type="password">
</div>
</div>
<!-- Checkbox with Legal Agreement -->
<div class="pt-2">
<label class="relative flex items-start gap-3 cursor-pointer group select-none">
<div class="relative flex items-center justify-center mt-0.5">
<input checked="" class="peer sr-only" id="legal-agree" type="checkbox">
<div class="w-5 h-5 rounded border border-[#D1D5DB] bg-white group-hover:border-[#1AA9C9] peer-checked:bg-[#1AA9C9] peer-checked:border-[#1AA9C9] transition-colors flex items-center justify-center"><span class="material-symbols-outlined text-white text-[16px] font-bold">check</span></div>
</div>
<span class="font-body-md text-body-md text-[#4B5563] text-[13px] leading-relaxed group-hover:text-[#0A0A0B] transition-colors">
              Я согласен с условиями использования и политикой конфиденциальности
            </span>
</label>
</div>
<!-- Main Action CTA Button -->
<div class="pt-3">
<button class="w-full py-3.5 px-6 rounded-xl bg-[#1AA9C9] hover:bg-[#0F8FAE] text-[#003642] font-title-sm text-title-sm font-extrabold flex items-center justify-center gap-2 shadow-lg shadow-[#1AA9C9]/25 transition-all active:scale-[0.99]" type="submit"><span>Создать аккаунт</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span></button>
</div>
<!-- Footer Switch Link -->
<div class="pt-2 text-center">
<p class="font-body-md text-body-md text-[#4B5563]">
            Уже есть аккаунт? 
            <a class="text-[#1AA9C9] hover:text-[#0F8FAE] font-label-md text-label-md hover:underline underline-offset-4 ml-1 font-semibold transition-all" href="#login">Войти</a>
</p>
</div>
</form>
</div>
<!-- Security & Institutional Metadata Badge -->
<div class="relative z-10 mt-6 flex items-center justify-center gap-4 text-[#6B7280]">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[15px]">encrypted</span>
<span class="font-label-sm text-label-sm text-[11px] tracking-wider uppercase font-semibold">256-bit TLS Gateway</span>
</div>
<span class="w-1 h-1 rounded-full bg-[#D1D5DB]"></span>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[15px]">radar</span>
<span class="font-label-sm text-label-sm text-[11px] tracking-wider uppercase font-semibold">IATA Protocol v4</span>
</div>
</div>
</div>
</div>
<script>
  (function() {
    const pwdInput = document.getElementById('user-password');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    if (pwdInput && toggleBtn) {
      toggleBtn.addEventListener('click', function() {
        const isText = pwdInput.getAttribute('type') === 'text';
        pwdInput.setAttribute('type', isText ? 'password' : 'text');
        const iconSpan = toggleBtn.querySelector('.material-symbols-outlined');
        if (iconSpan) {
          iconSpan.textContent = isText ? 'visibility_off' : 'visibility';
        }
      });
    }
  })();
</script></main>

</body></html>
