<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Вход в Решись Авиа" />
    <title>Вход — Решись Авиа</title>
    <link rel="stylesheet" href="style.css" />
    <script src="auth.js" defer></script>
  </head>
  <body class="auth-page">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="index.html" aria-label="Решись Авиа — на главную">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M21.4 14.1v-2l-8.3-5.2V2.7a1.1 1.1 0 0 0-2.2 0v4.2l-8.3 5.2v2l8.3-2.6v4.8l-2.5 1.6v1.4l3.6-1 3.6 1v-1.4l-2.5-1.6v-4.8l8.3 2.6Z" />
            </svg>
          </span>
          <span class="brand__name">Решись Авиа</span>
        </a>

        <button class="icon-button theme-toggle" id="auth-theme-toggle" type="button" aria-label="Включить тёмную тему" aria-pressed="false" title="Переключить тему">
          <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.5" />
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
          </svg>
          <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.7 8.7 0 1 0 20.2 15.1Z" />
          </svg>
        </button>
      </div>
    </header>

    <main class="auth-layout">
      <div class="hero__orbit hero__orbit--outer" aria-hidden="true"></div>
      <div class="hero__orbit hero__orbit--inner" aria-hidden="true"></div>

      <div class="auth-content">
        <header class="auth-intro">
          <h1>Рассчитай спрос</h1>
          <p>Прогноз спроса на авиабилеты за пару секунд</p>
        </header>

        <section class="auth-card" aria-label="Авторизация">
          <div class="auth-tabs" role="tablist" aria-label="Тип аккаунта">
            <button class="auth-tab" type="button" role="tab" aria-selected="false" data-auth-mode="register">Регистрация</button>
            <button class="auth-tab auth-tab--active" type="button" role="tab" aria-selected="true" data-auth-mode="login">Вход</button>
          </div>

          <form class="auth-form" id="login-form">
            <div class="auth-field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="name@company.com"
                autocomplete="email"
              />
            </div>

            <div class="auth-field">
              <label for="password">Пароль</label>
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Введите пароль"
                autocomplete="current-password"
              />
            </div>

            <div class="auth-options">
              <label class="remember-option">
                <input type="checkbox" name="remember" />
                <span>Запомнить меня</span>
              </label>
              <span class="auth-link">Забыли пароль?</span>
            </div>

            <button class="auth-submit" type="button">
              <span>Войти</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" />
              </svg>
            </button>
          </form>

          <form class="auth-form" id="register-form" hidden>
            <div class="auth-field">
              <label for="register-name">ФИО</label>
              <input id="register-name" name="fullName" type="text" placeholder="Фамилия, имя и отчество" autocomplete="name" />
            </div>
            <div class="auth-field">
              <label for="register-email">Email</label>
              <input id="register-email" name="email" type="email" placeholder="name@company.com" autocomplete="email" />
            </div>
            <div class="auth-field">
              <label for="register-password">Пароль</label>
              <input id="register-password" name="password" type="password" placeholder="Придумайте пароль" autocomplete="new-password" />
            </div>
            <button class="auth-submit" type="button">
              <span>Создать аккаунт</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" />
              </svg>
            </button>
          </form>

          <p class="auth-switch" id="login-switch">
            Нет аккаунта?
            <button class="auth-link-button" type="button" data-auth-mode="register">Зарегистрироваться</button>
          </p>
          <p class="auth-switch" id="register-switch" hidden>
            Уже есть аккаунт?
            <button class="auth-link-button" type="button" data-auth-mode="login">Войти</button>
          </p>
        </section>
      </div>
    </main>
  </body>
</html>
